<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 580" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="1500" height="580" fill="#f7f9fb"/>

  <!-- TITULO -->
  <text x="40" y="52" font-size="27" font-weight="700" fill="#1f3555">Item nonresponse and structural blanks</text>
  <text x="40" y="82" font-size="16.5" fill="#5a6b80">After collapsing routes, both cells are blank, but they have different meanings.</text>

  <!-- ====== PANEL 1: ANTES DEL COLAPSO ====== -->
  <rect x="40" y="110" width="430" height="400" rx="14" fill="#ffffff" stroke="#c9d6e3" stroke-width="2"/>
  <rect x="40" y="110" width="430" height="46" rx="14" fill="#e8eff7"/>
  <rect x="40" y="142" width="430" height="14" fill="#e8eff7"/>
  <text x="62" y="141" font-size="18.5" font-weight="700" fill="#1f3555">1. Before collapsing routes</text>

  <!-- caso A -->
  <rect x="62" y="176" width="386" height="140" rx="10" fill="#fdf6ec" stroke="#e0b473" stroke-width="1.8"/>
  <text x="80" y="203" font-size="15.5" font-weight="700" fill="#8a5a15">Respondent 1 · Branch WITH a bakery</text>
  <text x="80" y="231" font-size="14.5" fill="#4a4a4a">The bakery question applies to this respondent</text>
  <text x="80" y="255" font-size="14.5" fill="#4a4a4a">under their questionnaire route.</text>
  <rect x="80" y="269" width="350" height="32" rx="7" fill="#ffffff" stroke="#e0b473" stroke-width="1.4"/>
  <text x="95" y="291" font-size="14.5" fill="#333">p12.3 · Bakery</text>
  <text x="418" y="291" font-size="15" font-weight="700" fill="#b06a10" text-anchor="end">— (blank)</text>

  <!-- caso B -->
  <rect x="62" y="332" width="386" height="140" rx="10" fill="#eef4fb" stroke="#7fa6cf" stroke-width="1.8"/>
  <text x="80" y="359" font-size="15.5" font-weight="700" fill="#1c4d80">Respondent 2 · Branch WITHOUT a bakery</text>
  <text x="80" y="387" font-size="14.5" fill="#4a4a4a">The bakery question does not apply:</text>
  <text x="80" y="411" font-size="14.5" fill="#4a4a4a">it was not shown in their questionnaire.</text>
  <rect x="80" y="425" width="350" height="32" rx="7" fill="#ffffff" stroke="#7fa6cf" stroke-width="1.4"/>
  <text x="95" y="447" font-size="14.5" fill="#333">p12.3 · Bakery</text>
  <text x="418" y="447" font-size="15" font-weight="700" fill="#2a6099" text-anchor="end">— (blank)</text>

  <!-- flecha 1 -->
  <path d="M478 305 L536 305" stroke="#1f3555" stroke-width="7" fill="none"/>
  <path d="M536 292 L558 305 L536 318 Z" fill="#1f3555"/>
  <text x="518" y="278" font-size="14" font-weight="600" fill="#1f3555" text-anchor="middle">collapse</text>

  <!-- ====== PANEL 2: DESPUES DEL COLAPSO ====== -->
  <rect x="572" y="110" width="330" height="400" rx="14" fill="#ffffff" stroke="#c9d6e3" stroke-width="2"/>
  <rect x="572" y="110" width="330" height="46" rx="14" fill="#f3ecf5"/>
  <rect x="572" y="142" width="330" height="14" fill="#f3ecf5"/>
  <text x="594" y="141" font-size="18.5" font-weight="700" fill="#4b2a5e">2. After collapsing routes</text>

  <rect x="596" y="186" width="282" height="230" rx="10" fill="#faf7fc" stroke="#a884bd" stroke-width="1.8"/>
  <text x="614" y="215" font-size="15.5" font-weight="700" fill="#4b2a5e">var_12 · Bakery</text>

  <rect x="614" y="238" width="246" height="34" rx="7" fill="#ffffff" stroke="#cdbad8" stroke-width="1.3"/>
  <text x="630" y="261" font-size="14.5" fill="#333">Respondent 1</text>
  <text x="790" y="261" font-size="15" font-weight="700" fill="#7a7a7a">—</text>

  <rect x="614" y="282" width="246" height="34" rx="7" fill="#ffffff" stroke="#cdbad8" stroke-width="1.3"/>
  <text x="630" y="305" font-size="14.5" fill="#333">Respondent 2</text>
  <text x="790" y="305" font-size="15" font-weight="700" fill="#7a7a7a">—</text>

  <text x="614" y="350" font-size="14.5" fill="#6b4a80">Both cells look the same:</text>
  <text x="614" y="374" font-size="14.5" fill="#6b4a80">the collapsed field does not</text>
  <text x="614" y="398" font-size="14.5" fill="#6b4a80">retain the route information.</text>

  <!-- flecha 2 -->
  <path d="M910 305 L968 305" stroke="#1f3555" stroke-width="7" fill="none"/>
  <path d="M968 292 L990 305 L968 318 Z" fill="#1f3555"/>
  <text x="948" y="264" font-size="13.5" font-weight="600" fill="#1f3555" text-anchor="middle"><tspan x="948" dy="0">route</tspan><tspan x="948" dy="18">dictionary</tspan></text>

  <!-- ====== PANEL 3: RECUPERACION ====== -->
  <rect x="1004" y="110" width="456" height="400" rx="14" fill="#ffffff" stroke="#c9d6e3" stroke-width="2"/>
  <rect x="1004" y="110" width="456" height="46" rx="14" fill="#e9f5ed"/>
  <rect x="1004" y="142" width="456" height="14" fill="#e9f5ed"/>
  <text x="1026" y="141" font-size="18.5" font-weight="700" fill="#1d5c39">3. Recovering the distinction</text>

  <text x="1026" y="182" font-size="14.5" fill="#4a4a4a">Each branch follows a questionnaire route.</text>
  <text x="1026" y="206" font-size="14.5" fill="#4a4a4a">A route dictionary identifies which questions</text>
  <text x="1026" y="230" font-size="14.5" fill="#4a4a4a">applied to each respondent.</text>

  <rect x="1026" y="252" width="412" height="72" rx="10" fill="#fdf6ec" stroke="#e0b473" stroke-width="1.8"/>
  <text x="1046" y="279" font-size="15.5" font-weight="700" fill="#8a5a15">Respondent 1 → item nonresponse</text>
  <text x="1046" y="305" font-size="14.5" fill="#4a4a4a">Applicable item left unanswered. Imputed.</text>

  <rect x="1026" y="338" width="412" height="72" rx="10" fill="#eef4fb" stroke="#7fa6cf" stroke-width="1.8"/>
  <text x="1046" y="365" font-size="15.5" font-weight="700" fill="#1c4d80">Respondent 2 → structural blank</text>
  <text x="1046" y="391" font-size="14.5" fill="#4a4a4a">Question not shown. Not imputed.</text>

  <rect x="1026" y="426" width="412" height="62" rx="10" fill="#e9f5ed" stroke="#6aa583" stroke-width="1.8"/>
  <text x="1046" y="452" font-size="14.5" fill="#1d5c39">Treating both alike would impute answers</text>
  <text x="1046" y="474" font-size="14.5" fill="#1d5c39">to questions a respondent was never shown.</text>

  <!-- NOTA -->
  <text x="40" y="546" font-size="14" fill="#8a97a6">Illustrative example. Question and variable names are fictional.</text>
</svg>