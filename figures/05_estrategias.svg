<title>Comparación de estrategias y costo computacional</title>
<desc>Comparación ilustrativa de ocho estrategias. Los tres pares MICE mostrados tienen scores 0.0271, 0.0272 y 0.0273. El par (2,2) se destaca por menor costo computacional y produce cuatro bases, frente a 25 o 100. Todos los scores y porcentajes son inventados; no representan resultados de la tesis.</desc>
